<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}사내 데이터 관리{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom mb-4">
      <div class="container">
        <span class="navbar-brand">사내 데이터 관리</span>
        <div>
          {% if user.is_authenticated %}
            <span class="me-3 text-muted">{{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}
              <button class="btn btn-sm btn-outline-secondary">로그아웃</button>
            </form>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container pb-4">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
